# Sitio de producción en UpCloud: /etc/nginx/sites-available/clinica
#
# Sirve el frontend (build estático de React en /var/www/clinica_front) y pasa
# /api, /admin y /static al backend Django (Gunicorn en 127.0.0.1:8001).
# Web y API quedan en el mismo origen, así que el frontend no necesita CORS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/clinica_front;
    index index.html;

    location ~ ^/(api|admin|static)(/|$) {
        proxy_pass http://127.0.0.1:8001;
        # Django valida el Host contra DJANGO_ALLOWED_HOSTS: se reenvía el que pidió
        # el navegador (la IP o el dominio), no "127.0.0.1:8001", que daría 400.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # JS/CSS con hash en el nombre: cambian de nombre en cada build, se cachean un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de la app (/agenda, /pacientes/123, /?paso=...): las resuelve React, así que
    # todo lo que no sea un archivo real devuelve index.html. no-cache para que un deploy
    # nuevo se vea al recargar.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
